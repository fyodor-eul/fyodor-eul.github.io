<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blog Viewer | Terminal Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/gruvbox-dark-hard.min.css">
  <style>
    /* Shared doc-viewer layout (terminal + TOC + pane) lives in css/styles.css */

    html, body {
      margin: 0;
      padding: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .doc-pane {
      touch-action: pan-y;
    }

    /* ── Language toggle ────────────────────────────── */
    .lang-switch {
      margin-left: auto;
      flex-shrink: 0;
      display: none;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .lang-switch-label {
      font-size: 0.7rem;
      font-weight: 700;
      font-family: var(--font-mono);
      letter-spacing: 0.06em;
      color: #665c54;
      transition: color 0.2s;
      min-width: 20px;
      text-align: center;
    }

    .lang-switch-label.active { color: #ebdbb2; }

    .lang-switch-track {
      position: relative;
      width: 52px;
      height: 28px;
      border-radius: 14px;
      background: #1d2021;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.6), inset 0 -1px 2px rgba(255,255,255,0.04);
      border: 1px solid #3c3836;
      transition: border-color 0.25s;
      flex-shrink: 0;
    }

    .lang-switch-track::after {
      content: "🇬🇧";
      position: absolute;
      top: 2px; left: 2px;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #3c3836;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      line-height: 22px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4);
      transition: transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    .lang-switch-track.on::after { content: "🇲🇲"; transform: translateX(24px); }
    .lang-switch-track.on { border-color: #b8bb26; }
  </style>
</head>
<body data-page="blog-viewer">

  <header class="site-header">
    <div class="nav-container">
      <div class="brand">
        <a href="blogs.html" class="nav-back-link">← Back to Blogs</a>
      </div>
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-links">
        <a href="index.html">~/home</a>
        <a href="blogs.html" class="active">~/blogs</a>
        <a href="projects.html">~/projects</a>
      </nav>
    </div>
    <div class="read-progress" id="read-progress"></div>
  </header>

  <!-- flat div, not inside .page-container -->
  <div class="doc-page">
    <div class="doc-terminal">

      <!-- Terminal chrome -->
      <div class="terminal-header">
        <span class="dot red"></span>
        <span class="dot amber"></span>
        <span class="dot green"></span>
        <span class="terminal-title-bar" id="blog-terminal-title">cat blog.md</span>
        <div id="lang-toggle" class="lang-switch" role="switch" aria-checked="false">
          <span class="lang-switch-label active" id="lang-label-en">EN</span>
          <div class="lang-switch-track" id="lang-switch-track"></div>
          <span class="lang-switch-label" id="lang-label-mm">မြ</span>
        </div>
      </div>

      <!-- Two-pane body -->
      <div class="doc-terminal-body">

        <!-- LEFT: TOC -->
        <div class="toc-pane" id="toc-sidebar">
          <div class="toc-pane-header">
            <span>~/</span> contents
          </div>
          <nav class="toc-nav" id="toc-nav">
            <!-- JS fills this -->
          </nav>
        </div>

        <!-- RIGHT: Blog -->
        <div class="doc-pane" id="blog-pane">
          <div class="doc-pane-inner">
            <article id="blog-content" class="markdown-content">
              <!-- JS-rendered blog -->
            </article>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
