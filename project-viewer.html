<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Project Viewer | Terminal Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/styles.css" />

  <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/solarized-dark.min.css">
  <style>
    /* Shared doc-viewer layout (terminal + TOC + pane) lives in css/styles.css */

    html, body {
      margin: 0;
      padding: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .doc-pane {
      touch-action: pan-y;
    }
  </style>
</head>
<body data-page="project-viewer">

  <header class="site-header">
    <div class="nav-container">
      <div class="brand">
        <a href="projects.html" class="nav-back-link">← Back to Projects</a>
      </div>
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-links">
        <a href="index.html">~/home</a>
        <a href="blogs.html">~/blogs</a>
        <a href="projects.html" class="active">~/projects</a>
      </nav>
    </div>
    <div class="read-progress" id="read-progress"></div>
  </header>

  <!-- flat div, not inside .page-container -->
  <div class="doc-page">
    <div class="doc-terminal">

      <!-- Terminal chrome -->
      <div class="terminal-header">
        <span class="dot red"></span>
        <span class="dot amber"></span>
        <span class="dot green"></span>
        <span class="terminal-title-bar" id="project-terminal-title">cat project.md</span>
      </div>

      <!-- Two-pane body -->
      <div class="doc-terminal-body">

        <!-- LEFT: TOC -->
        <div class="toc-pane" id="toc-sidebar">
          <div class="toc-pane-header">
            <span>~/</span> contents
          </div>
          <nav class="toc-nav" id="toc-nav">
            <!-- JS fills this -->
          </nav>
        </div>

        <!-- RIGHT: Project -->
        <div class="doc-pane" id="project-pane">
          <div class="doc-pane-inner">
            <article id="project-content" class="markdown-content">
              <!-- JS-rendered project -->
            </article>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
